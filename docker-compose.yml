version: '3.8'

services:

  app:
    build: .
    container_name: betalent_app
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./:/var/www
    working_dir: /var/www
    depends_on:
      - mysql
      - gateways-mock

  nginx:
    image: nginx:alpine
    container_name: betalent_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8
    container_name: betalent_mysql
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - MYSQL_DATABASE=betalent
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=betalent
      - MYSQL_PASSWORD=betalent
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  
  gateways-mock:
    image: matheusprotzen/gateways-mock
    container_name: gateways_mock
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "3001:3001"
      - "3002:3002"
    restart: always

volumes:
  mysql_data: